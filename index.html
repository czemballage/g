<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subject Zero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#05080b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Fragment+Mono&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: one screen. Your clean days on top, the monster you are starving in the middle, one red button at the bottom. Single dark CRT look, by choice. */
:root {
  --void: #05080b;
  --line: #16242e;
  --ice: #a9dcff;
  --ice-dim: #5d7f93;
  --bone: #e3ecf0;
  --blood: #ff4b3a;
  --blood-deep: #160605;
  --display: 'Doto', 'Fragment Mono', ui-monospace, monospace;
  --mono: 'Fragment Mono', ui-monospace, Menlo, monospace;
  --ar: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--bone); font-family: var(--ar); font-size: 15px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60; background: repeating-linear-gradient(0deg, rgba(169,220,255,.03) 0 1px, transparent 1px 3px); }
.lt { font-family: var(--mono); direction: ltr; unicode-bidi: isolate; letter-spacing: .08em; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible { outline: 1px dashed var(--ice); outline-offset: 4px; }

.screen {
  max-width: 460px; margin: 0 auto; min-height: 100%;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 18px 20px;
  display: flex; flex-direction: column; gap: 18px;
}

/* clean days */
.count { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.count .num { font-family: var(--display); font-weight: 900; font-size: clamp(76px, 26vw, 112px); line-height: .82; color: var(--ice); direction: ltr; text-shadow: 0 0 22px rgba(169,220,255,.35); font-variant-numeric: tabular-nums; }
.count .lbl { display: grid; text-align: right; padding-bottom: 4px; }
.count .lbl b { font-size: 18px; font-weight: 700; }
.count .lbl span { color: var(--ice-dim); font-size: 13px; }
.count .lbl .lt { font-size: 13px; }

/* monster */
.monster { display: grid; justify-items: center; gap: 6px; text-align: center; flex: 1; align-content: center; }
.monster canvas { width: min(270px, 70vw); height: min(270px, 70vw); max-width: 100%; display: block; }
.code { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--blood); direction: ltr; }
.mname { font-size: 26px; font-weight: 700; line-height: 1.2; }
.hp { width: 100%; max-width: 300px; display: grid; gap: 6px; }
.hpbar { height: 6px; display: flex; direction: ltr; background: var(--line); }
.hpbar i { display: block; height: 100%; background: var(--blood); box-shadow: 0 0 10px rgba(255,75,58,.6); transition: width .8s; }
.hint { color: var(--ice-dim); font-size: 13px; }

/* collection strip */
.strip { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; direction: ltr; }
.slot { aspect-ratio: 1; max-width: 100%; border: 1px solid var(--line); display: grid; place-items: center; position: relative; }
.slot canvas { width: 100%; height: 100%; display: block; }
.slot.cur { border-color: var(--blood); }
.slot.lock::after { content: "?"; position: absolute; font-family: var(--mono); color: var(--ice-dim); font-size: 12px; }

/* actions */
.fight { width: 100%; background: var(--blood); color: var(--blood-deep); padding: 18px 12px; font-size: 18px; font-weight: 700; display: grid; gap: 0; }
.fight small { font-size: 12px; font-weight: 600; opacity: .7; }
.fight:active { transform: translateY(1px); }
.quiet { color: var(--ice-dim); font-size: 13px; text-decoration: underline; text-underline-offset: 4px; justify-self: center; padding: 6px 10px; }
.actions { display: grid; gap: 8px; }

/* overlay */
.ov { position: fixed; inset: 0; z-index: 40; background: var(--void); overflow-y: auto; }
.ov.red { background: #0d0303; }
.ov .screen { justify-content: center; text-align: center; }
.ov h2 { margin: 0; font-size: 26px; line-height: 1.3; text-wrap: balance; }
.ov p { margin: 0 auto; color: var(--bone); opacity: .8; max-width: 34ch; }
.cta { width: 100%; background: var(--ice); color: var(--void); padding: 16px; font-weight: 700; font-size: 16px; }
.cta.red { background: var(--blood); color: var(--blood-deep); }
.ghost { width: 100%; border: 1px solid var(--line); padding: 13px; color: var(--ice-dim); font-size: 14px; }
.foe-wrap { position: relative; display: grid; place-items: center; margin: 0 auto; width: min(300px, 78vw); aspect-ratio: 1; max-width: 100%; }
.foe-wrap canvas { width: 78%; height: 78%; display: block; position: relative; }
.ring { position: absolute; inset: 0; border: 2px solid var(--blood); border-radius: 50%; opacity: .5; transform: scale(.62); transition: transform 4s linear; }
.phase { font-size: 34px; font-weight: 700; line-height: 1.1; min-height: 1.2em; }
.steps { display: flex; gap: 6px; justify-content: center; direction: ltr; }
.steps i { width: 26px; height: 4px; background: var(--line); }
.steps i.on { background: var(--blood); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { border: 1px solid var(--line); padding: 10px 16px; font-size: 15px; }
.chip[aria-pressed="true"] { border-color: var(--ice); color: var(--ice); }
.title { font-family: var(--display); font-weight: 900; color: var(--ice); font-size: clamp(52px, 17vw, 76px); line-height: .9; direction: ltr; text-shadow: 0 0 22px rgba(169,220,255,.3); }
@media (prefers-reduced-motion: reduce) { .ring { transition: none; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="ov" class="ov" hidden></div>

<script>
(() => {
'use strict';
document.documentElement.dir = 'rtl'; document.documentElement.lang = 'ar';
const DAY = 864e5, HOUR = 36e5, KEY = 'subject-zero.v1';

/* Each monster guards a milestone. Every clean hour it loses dots; on its day it dies. */
const ENTITIES = [
  { id: 'E-01', d: 1,   en: 'THE WHISPERER', ar: 'الهامس',        n: 11, seed: 41,   lore: 'يقول لك «مرة أخيرة فقط». يموت إذا لم تُجبه 24 ساعة.' },
  { id: 'E-02', d: 3,   en: 'SIREN',         ar: 'النداهة',       n: 11, seed: 7,    lore: 'تتغذى على الملل والتمرير الذي لا ينتهي.' },
  { id: 'E-03', d: 7,   en: 'HOLLOW',        ar: 'الجوف',         n: 13, seed: 913,  lore: 'لا يهاجم. ينتظر أن تتعب من الفراغ.' },
  { id: 'E-04', d: 14,  en: 'DOPA-WYRM',     ar: 'دودة الدوبامين', n: 13, seed: 222,  lore: 'تحفر في آخر الليل، خلف باب مغلق وشاشة مضاءة.' },
  { id: 'E-05', d: 30,  en: 'THE GLASS',     ar: 'المرآة',        n: 15, seed: 58,   lore: 'تريك نسختك القديمة وتقنعك أنها أنت.' },
  { id: 'E-06', d: 60,  en: 'ECHO-LEGION',   ar: 'الفيلق',        n: 15, seed: 3071, lore: 'أصداء ذكريات. كل صدى أضعف من الذي قبله.' },
  { id: 'E-07', d: 90,  en: 'REBOOT',        ar: 'المُعيد',        n: 17, seed: 90,   lore: 'يحاول إعادة تشغيل النظام القديم. هزيمته تعني أنك أُعيد بناؤك.' },
  { id: 'E-08', d: 180, en: 'SOVEREIGN',     ar: 'الملك القديم',  n: 19, seed: 1180, lore: 'حكم طويلاً. الآن عرش فارغ ينتظر أن تنسى.' },
  { id: 'E-09', d: 365, en: 'THE ORIGIN',    ar: 'الأصل',         n: 21, seed: 365,  lore: 'المصدر نفسه. لا أحد يعرف شكله قبل أن يصل إليه.' },
];
const BREATH = [['شهيق', 4], ['احبس', 4], ['زفير', 4], ['احبس', 4]];
const CYCLES = 4;

/* ---------- state ---------- */
let S = load();
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.start) return Object.assign({ best: 0, won: 0, kills: {} }, s); } catch (e) {} return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const now = () => Date.now();
const streak = () => Math.max(0, now() - S.start);
const current = () => ENTITIES.find(e => streak() < e.d * DAY) || null;
const hpOf = e => { const i = ENTITIES.indexOf(e), from = i ? ENTITIES[i - 1].d * DAY : 0; return Math.max(0, Math.min(1, 1 - (streak() - from) / (e.d * DAY - from))); };
const pad = n => String(n).padStart(2, '0');
const left = ms => { const d = Math.floor(ms / DAY), h = Math.floor(ms % DAY / HOUR), m = Math.floor(ms % HOUR / 6e4); return d ? `${d} ${d > 2 && d < 11 ? 'أيام' : 'يوم'} و ${h} ساعة` : h ? `${h} ساعة و ${m} دقيقة` : `${m} دقيقة`; };
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ---------- dot-matrix monsters ---------- */
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeSprite(seed, n) {
  const r = rng(seed), g = [], h = Math.ceil(n / 2);
  for (let y = 0; y < n; y++) {
    const row = new Array(n).fill(0);
    for (let x = 0; x < h; x++) {
      const dx = (h - 1 - x) / h, dy = Math.abs(y - n * 0.45) / n;
      const v = r() < 0.78 - dx * 0.55 - dy * 0.9 + (y > n * 0.7 ? 0.12 * r() : 0) ? 1 : 0;
      row[x] = v; row[n - 1 - x] = v;
    }
    g.push(row);
  }
  const ey = Math.floor(n * 0.36), ex = h - 2 - Math.floor(n / 6);
  for (let y = ey - 1; y <= ey + 1; y++) for (let x = ex - 1; x <= ex + 1; x++) { g[y][x] = 1; g[y][n - 1 - x] = 1; }
  g[ey][ex] = 2; g[ey][n - 1 - ex] = 2;
  const my = Math.floor(n * 0.62);
  for (let x = Math.floor(n * 0.3); x < Math.ceil(n * 0.7); x++) g[my][x] = x % 2 ? 1 : 0;
  for (let y = my + 1; y < n; y++) { const x = Math.floor(n * 0.2 + r() * 2); if (r() < 0.7) { g[y][x] = 1; g[y][n - 1 - x] = 1; } }
  // each dot gets a fixed decay threshold so the monster crumbles the same way every time
  const k = rng(seed * 7 + 1), decay = g.map(row => row.map(() => k()));
  return { n, g, decay };
}

const LIVE = new Map();
function bind(c, sprite, o) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = c.height = Math.round((c.clientWidth || 100) * dpr);
  LIVE.set(c, Object.assign({ sprite, mode: 'alive', color: '#a9dcff', hp: 1, born: now(), salt: Math.random() * 1e9 }, o));
  return LIVE.get(c);
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(c, st, t) {
  const ctx = c.getContext('2d'), { n, g, decay } = st.sprite, W = c.width, cs = W / (n + 2);
  ctx.clearRect(0, 0, W, W);
  const noise = rng(Math.floor(t / 110) + st.salt);
  const glitch = !reduced && st.mode === 'alive' && (t % 2800) < 110;
  const dying = st.mode === 'dying' ? Math.min(1, (t - st.born) / 1600) : 0;
  const pulse = 0.55 + 0.45 * Math.sin(t / 260);
  const keep = 0.12 + 0.88 * st.hp;
  const eye = st.color === '#ff4b3a' ? '227,236,240' : '255,75,58';
  for (let y = 0; y < n; y++) {
    const shift = glitch && noise() < 0.3 ? (noise() < 0.5 ? -1 : 1) : 0;
    for (let x = 0; x < n; x++) {
      let v = g[y][x];
      if (st.mode === 'locked') v = noise() < 0.25 ? 1 : 0;
      else if (v === 1 && decay[y][x] > keep) v = 0;
      if (dying && v && noise() < dying) v = 0;
      const px = (x + 1.5 + shift) * cs, py = (y + 1.5) * cs;
      ctx.beginPath();
      if (v === 2 && st.mode !== 'locked') { ctx.fillStyle = st.mode === 'dead' ? '#3b5566' : `rgba(${eye},${pulse})`; ctx.arc(px, py, cs * .42, 0, 7); }
      else if (v) { ctx.fillStyle = st.mode === 'dead' ? '#2a3d4a' : st.mode === 'locked' ? '#16242e' : st.color; ctx.arc(px, py, cs * .36, 0, 7); }
      else { ctx.fillStyle = '#101b22'; ctx.arc(px, py, cs * .12, 0, 7); }
      ctx.fill();
    }
  }
}
let last = 0;
(function frame(t) {
  requestAnimationFrame(frame);
  if (t - last < 50) return; last = t;
  for (const [c, st] of LIVE) { if (!c.isConnected) LIVE.delete(c); else draw(c, st, now()); }
})(0);

/* ---------- main screen ---------- */
const app = document.getElementById('app'), ov = document.getElementById('ov');
let heroSt = null;

function render() {
  if (!S) return renderStart();
  const e = current(), days = Math.floor(streak() / DAY);
  app.innerHTML = `<div class="screen">
    <div class="count">
      <div class="lbl"><b>${days === 1 ? 'يوم نظيف' : 'أيام نظيفة'}</b><span class="lt" id="clock"></span><span id="best"></span></div>
      <div class="num" id="days">${days}</div>
    </div>
    ${e ? `<section class="monster">
      <canvas id="hero" aria-label="${e.ar}"></canvas>
      <div class="code">${e.id} · ${e.en}</div>
      <div class="mname">${e.ar}</div>
      <div class="hp"><div class="hpbar"><i id="hpbar"></i></div><div class="hint" id="left"></div></div>
    </section>` : `<section class="monster"><div class="mname">كل الكيانات سقطت.</div><p class="hint">سنة كاملة. أنت خارج نطاق البروتوكول.</p></section>`}
    <div class="strip">${ENTITIES.map(x => {
      const cls = S.kills[x.id] ? 'dead' : e && x.id === e.id ? 'cur' : 'lock';
      return `<button class="slot ${cls}" data-id="${x.id}" aria-label="${cls === 'lock' ? 'مجهول' : x.ar}"><canvas></canvas></button>`;
    }).join('')}</div>
    <div class="actions">
      <button class="fight" id="fight">أشعر بالرغبة<small>دقيقة واحدة، وتقتلها</small></button>
      <button class="quiet" id="relapse">سجّل انتكاسة</button>
    </div>
  </div>`;
  heroSt = e ? bind(document.getElementById('hero'), makeSprite(e.seed, e.n), { hp: hpOf(e) }) : null;
  app.querySelectorAll('.slot').forEach(b => {
    const x = ENTITIES.find(y => y.id === b.dataset.id);
    bind(b.querySelector('canvas'), makeSprite(x.seed, x.n), { mode: b.classList.contains('dead') ? 'dead' : b.classList.contains('cur') ? 'alive' : 'locked', color: '#ff4b3a', hp: e && x.id === e.id ? hpOf(e) : 1 });
    b.onclick = () => openInfo(x, b.classList.contains('lock'));
  });
  document.getElementById('fight').onclick = startFight;
  document.getElementById('relapse').onclick = openRelapse;
  tick();
}

function tick() {
  if (!S || !document.getElementById('days')) return;
  const ms = streak();
  for (const e of ENTITIES) if (ms >= e.d * DAY && !S.kills[e.id]) { if (ov.hidden) { S.kills[e.id] = now(); save(); showKill(e); } return; }
  document.getElementById('days').textContent = Math.floor(ms / DAY);
  document.getElementById('clock').textContent = pad(Math.floor(ms % DAY / HOUR)) + ':' + pad(Math.floor(ms % HOUR / 6e4)) + ':' + pad(Math.floor(ms % 6e4 / 1e3));
  document.getElementById('best').textContent = S.best > ms ? 'أفضل رقم: ' + Math.floor(S.best / DAY) + ' يوم' : '';
  const e = current();
  if (e && heroSt) {
    heroSt.hp = hpOf(e);
    document.getElementById('hpbar').style.width = (heroSt.hp * 100).toFixed(2) + '%';
    document.getElementById('left').textContent = 'يموت بعد ' + left(e.d * DAY - ms);
  }
}
setInterval(tick, 1000);

/* ---------- overlays ---------- */
function openOv(html, red) { ov.className = 'ov' + (red ? ' red' : ''); ov.innerHTML = `<div class="screen">${html}</div>`; ov.hidden = false; ov.scrollTop = 0; }
function closeOv() { ov.hidden = true; ov.innerHTML = ''; render(); }

function openInfo(x, locked) {
  openOv(locked
    ? `<div class="code">${x.id} · CLASSIFIED</div><h2>مجهول</h2><p>يظهر في اليوم ${x.d}. لن تعرف شكله قبل أن تصل إليه.</p><button class="ghost" id="ok">رجوع</button>`
    : `<div class="foe-wrap"><canvas id="ic"></canvas></div><div class="code">${x.id} · ${x.en}</div><h2>${x.ar}</h2><p>${x.lore}</p><p class="hint">${S.kills[x.id] ? 'هزمته.' : 'يحرس اليوم ' + x.d + '.'}</p><button class="ghost" id="ok">رجوع</button>`);
  if (!locked) bind(document.getElementById('ic'), makeSprite(x.seed, x.n), { mode: S.kills[x.id] ? 'dead' : 'alive', hp: S.kills[x.id] ? 1 : hpOf(x) });
  document.getElementById('ok').onclick = closeOv;
}

function showKill(e) {
  buzz([60, 40, 60, 40, 200]);
  const next = current();
  openOv(`<div class="foe-wrap"><canvas id="kc"></canvas></div>
    <div class="code">${e.id} · TERMINATED</div>
    <h2>${e.ar} مات.</h2>
    <p>${e.d} ${e.d === 1 ? 'يوم' : 'أيام'} ولم تُطعمه مرة واحدة.${next ? ' شيء آخر استيقظ.' : ''}</p>
    <button class="cta" id="ok">${next ? 'واجه ' + next.ar : 'استمر'}</button>`);
  bind(document.getElementById('kc'), makeSprite(e.seed, e.n), { mode: 'dying', hp: .15 });
  document.getElementById('ok').onclick = closeOv;
}

let fight = null;
function startFight() {
  buzz(120);
  const seed = Math.floor(Math.random() * 1e6);
  openOv(`<div class="code">URGE DETECTED</div>
    <div class="foe-wrap"><div class="ring" id="ring"></div><canvas id="foe"></canvas></div>
    <div class="phase" id="phase" aria-live="polite">استعد</div>
    <div class="steps">${Array.from({ length: CYCLES }, () => '<i></i>').join('')}</div>
    <p>تنفّس مع الدائرة. كل نفَس يأكل منه. لا تنظر إلى أي شاشة أخرى.</p>
    <button class="ghost" id="flee">انسحاب</button>`, true);
  fight = { seed, step: -1, st: bind(document.getElementById('foe'), makeSprite(seed, 15), { color: '#ff4b3a' }), timer: null };
  document.getElementById('flee').onclick = () => { clearTimeout(fight.timer); fight = null; closeOv(); };
  fight.timer = setTimeout(nextPhase, 1200);
}
function nextPhase() {
  if (!fight) return;
  fight.step++;
  const total = BREATH.length * CYCLES;
  fight.st.hp = 1 - fight.step / total;
  if (fight.step >= total) return winFight();
  const [word, sec] = BREATH[fight.step % BREATH.length], kind = fight.step % BREATH.length;
  document.getElementById('phase').textContent = word;
  const ring = document.getElementById('ring');
  ring.style.transitionDuration = sec + 's';
  if (kind === 0) ring.style.transform = 'scale(1)';
  if (kind === 2) ring.style.transform = 'scale(.62)';
  document.querySelectorAll('.steps i').forEach((el, i) => el.classList.toggle('on', i < Math.floor(fight.step / BREATH.length) + 1));
  if (kind === 0) buzz(25);
  fight.timer = setTimeout(nextPhase, sec * 1000);
}
function winFight() {
  S.won++; save(); buzz([80, 50, 160]);
  const seed = fight.seed; fight = null;
  openOv(`<div class="foe-wrap"><canvas id="kc"></canvas></div>
    <div class="code">THREAT NEUTRALIZED · #${S.won}</div>
    <h2>الموجة انكسرت.</h2>
    <p>كل رغبة تقتلها تعود أضعف. هذه رقم ${S.won}.</p>
    <button class="cta" id="ok">رجوع</button>`, true);
  bind(document.getElementById('kc'), makeSprite(seed, 15), { mode: 'dying', color: '#ff4b3a', hp: .1 });
  document.getElementById('ok').onclick = closeOv;
}

function openRelapse() {
  openOv(`<div class="code">BREACH</div>
    <h2>هل انتكست؟</h2>
    <p>العدّاد سيعود إلى الصفر. الكيانات التي قتلتها وأفضل رقم لك يبقون.</p>
    <button class="cta red" id="go">نعم، ابدأ من جديد</button>
    <button class="ghost" id="x">لا، رجوع</button>`, true);
  document.getElementById('go').onclick = () => {
    S.best = Math.max(S.best, streak()); S.start = now(); save(); buzz(300);
    openOv(`<div class="code">SYSTEM REBOOT</div><h2>جولة خسرتها. الحرب لم تنتهِ.</h2>
      <p>أفضل رقم لك: ${Math.floor(S.best / DAY)} يوم. المرة القادمة اضغط الزر الأحمر قبل أن تفكر.</p>
      <button class="cta" id="ok">ابدأ</button>`, true);
    document.getElementById('ok').onclick = closeOv;
  };
  document.getElementById('x').onclick = closeOv;
}

function renderStart() {
  let ago = 0;
  app.innerHTML = `<div class="screen" style="justify-content:center;text-align:center">
    <div class="title">SUBJECT<br>ZERO</div>
    <div class="monster" style="flex:0"><canvas id="intro" aria-hidden="true"></canvas></div>
    <p style="margin:0 auto;max-width:32ch">تسعة كيانات تتغذى على انتباهك. كل يوم تصمد فيه يأكل منها، حتى تموت.</p>
    <b>متى كانت آخر مرة؟</b>
    <div class="chips">${[['اليوم', 0], ['أمس', 1], ['قبل 3 أيام', 3], ['قبل أسبوع', 7]].map(([l, v], i) => `<button class="chip" data-v="${v}" aria-pressed="${i === 0}">${l}</button>`).join('')}</div>
    <button class="cta" id="begin">ابدأ</button>
  </div>`;
  bind(document.getElementById('intro'), makeSprite(365, 21), {});
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => { ago = +b.dataset.v; app.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b)); });
  document.getElementById('begin').onclick = () => {
    S = { start: now() - ago * DAY, best: 0, won: 0, kills: {} };
    for (const e of ENTITIES) if (ago >= e.d) S.kills[e.id] = now();
    save(); render();
  };
}

render();
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
})();
</script>
</body>
</html>
