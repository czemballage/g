<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subject Zero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#05080b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Fragment+Mono&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width CRT console; a live dossier on top, the active entity below, a terminal nav pinned to the bottom edge. Single dark look, by choice. */
:root {
  --void: #05080b;
  --panel: #0a1218;
  --line: #1a2a36;
  --ice: #a9dcff;
  --ice-dim: #4f7389;
  --bone: #dfe9ee;
  --blood: #ff4b3a;
  --blood-deep: #1e0807;
  --display: 'Doto', 'Fragment Mono', ui-monospace, monospace;
  --mono: 'Fragment Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --ar: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--void); color: var(--bone);
  font-family: var(--ar); font-size: 15px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(0deg, rgba(169,220,255,.035) 0 1px, transparent 1px 3px);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--void);
}
.lt { font-family: var(--mono); direction: ltr; unicode-bidi: isolate; letter-spacing: .06em; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 1px dashed var(--ice); outline-offset: 3px; }

#app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}

/* top bar */
.bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--ice-dim); border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.bar b { color: var(--ice); font-weight: 400; }
.blink { animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* frame panels, like the pinned HUD cards */
.frame { border: 1px solid var(--line); background: var(--panel); position: relative; }
.frame::before, .frame::after { content: ""; position: absolute; width: 8px; height: 8px; border: 1px solid var(--ice-dim); }
.frame::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.frame::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
.frame-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--ice); }

/* streak */
.streak { padding: 14px 12px 10px; display: grid; gap: 4px; }
.days { font-family: var(--display); font-weight: 900; color: var(--ice); font-size: clamp(84px, 30vw, 128px); line-height: .9; direction: ltr; text-align: left; text-shadow: 0 0 18px rgba(169,220,255,.35); font-variant-numeric: tabular-nums; }
.days small { font-size: .22em; font-weight: 700; color: var(--ice-dim); margin-left: .3em; }
.clock { font-family: var(--display); font-weight: 700; font-size: 26px; color: var(--ice); direction: ltr; text-align: left; font-variant-numeric: tabular-nums; }
.sub { color: var(--ice-dim); font-size: 12px; }

/* entity card */
.entity { display: grid; grid-template-columns: 132px 1fr; gap: 0; }
.entity canvas { width: 132px; height: 132px; display: block; border-left: 1px solid var(--line); background: var(--void); }
.entity .info { padding: 10px 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.ename { font-family: var(--mono); font-size: 13px; color: var(--blood); direction: ltr; text-align: right; letter-spacing: .08em; }
.ename-ar { font-weight: 700; font-size: 18px; line-height: 1.2; }
.hp { display: grid; gap: 4px; font-size: 11px; color: var(--ice-dim); }
.hpbar { height: 8px; border: 1px solid var(--line); display: flex; direction: ltr; }
.hpbar i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--blood) 0 5px, transparent 5px 7px); transition: width .6s; }
.rows { display: grid; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
.row:last-child { border-bottom: 0; }
.row .k { color: var(--ice-dim); }
.row .v { color: var(--ice); font-family: var(--mono); direction: ltr; font-variant-numeric: tabular-nums; }

/* actions */
.engage {
  width: 100%; border: 1px solid var(--blood); background: var(--blood-deep); color: var(--blood);
  padding: 16px 12px; display: grid; gap: 2px; text-align: center; position: relative; overflow: hidden;
}
.engage .big { font-family: var(--mono); font-size: 17px; letter-spacing: .2em; }
.engage .ar { font-size: 13px; color: var(--bone); opacity: .85; }
.engage::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,75,58,.18), transparent); transform: translateX(-100%); animation: sweep 3.2s infinite; }
@keyframes sweep { 60%, 100% { transform: translateX(100%); } }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 11px 8px; display: grid; gap: 0; text-align: center; font-size: 13px; }
.btn .lt { font-size: 11px; color: var(--ice); }
.btn.dim { color: var(--ice-dim); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn:not([disabled]):active, .engage:active { transform: translateY(1px); }

/* bestiary */
.list { display: grid; gap: 10px; }
.beast { display: grid; grid-template-columns: 92px 1fr; }
.beast canvas { width: 92px; height: 92px; display: block; border-left: 1px solid var(--line); background: var(--void); }
.beast .info { padding: 8px 10px; display: grid; gap: 3px; min-width: 0; align-content: start; }
.beast p { margin: 0; font-size: 13px; color: var(--bone); opacity: .8; }
.tag { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; padding: 1px 6px; border: 1px solid currentColor; justify-self: start; direction: ltr; }
.tag.dead { color: var(--ice-dim); }
.tag.live { color: var(--blood); }
.tag.lock { color: var(--line); }
.beast.locked .ename-ar, .beast.locked p { color: var(--ice-dim); }

/* dossier */
.file { display: grid; grid-template-columns: 1fr; }
.grid28 { display: grid; grid-template-columns: repeat(14, 1fr); gap: 5px; padding: 12px 10px; direction: ltr; }
.grid28 i { aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--line); }
.grid28 i.c { background: var(--ice); box-shadow: 0 0 6px rgba(169,220,255,.5); }
.grid28 i.b { background: var(--blood); }
.legend { display: flex; gap: 14px; padding: 0 10px 10px; font-size: 11px; color: var(--ice-dim); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 5px; background: var(--c); }
.trig { display: grid; gap: 6px; padding: 10px; }
.trig .t { display: grid; grid-template-columns: 70px 1fr 24px; align-items: center; gap: 8px; font-size: 12px; }
.trig .dots { direction: ltr; font-family: var(--mono); color: var(--blood); letter-spacing: 2px; overflow: hidden; white-space: nowrap; }
.trig .n { font-family: var(--mono); color: var(--ice-dim); text-align: left; }
.log { font-family: var(--mono); font-size: 11px; padding: 8px 10px; direction: ltr; text-align: left; display: grid; gap: 3px; color: var(--ice-dim); overflow-x: auto; }
.log .w { color: var(--ice); }
.log .r { color: var(--blood); }
.empty { color: var(--ice-dim); font-size: 12px; padding: 10px; }

/* nav */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--void); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
nav .in { max-width: 448px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav button { padding: 10px 4px 12px; display: grid; gap: 0; text-align: center; font-size: 12px; color: var(--ice-dim); border-top: 2px solid transparent; margin-top: -1px; }
nav button .lt { font-size: 11px; }
nav button[aria-current="page"] { color: var(--ice); border-top-color: var(--ice); }

/* overlays */
.ov {
  position: fixed; inset: 0; z-index: 40; background: var(--void); overflow-y: auto;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.ov .in { max-width: 440px; margin: 0 auto; display: grid; gap: 14px; }
.ov.red { background: #0e0303; }
.ov h2 { margin: 0; font-family: var(--mono); font-weight: 400; font-size: 13px; letter-spacing: .2em; color: var(--blood); direction: ltr; text-align: right; }
.ov h3 { margin: 0; font-size: 22px; line-height: 1.3; text-wrap: balance; }
.ov p { margin: 0; color: var(--bone); opacity: .85; }
.foe { width: min(240px, 70vw); height: min(240px, 70vw); max-width: 100%; display: block; margin: 0 auto; }
.phase { text-align: center; display: grid; gap: 2px; }
.phase .w { font-size: 30px; font-weight: 700; }
.phase .n { font-family: var(--display); font-weight: 900; font-size: 56px; color: var(--blood); line-height: 1; }
.order { border: 1px dashed var(--blood); color: var(--bone); padding: 10px 12px; font-size: 14px; }
.order b { color: var(--blood); font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .14em; display: block; direction: ltr; text-align: right; }
.cta { border: 1px solid var(--ice); color: var(--void); background: var(--ice); padding: 13px; font-weight: 700; font-size: 15px; width: 100%; }
.cta.red { background: var(--blood); border-color: var(--blood); color: var(--blood-deep); }
.ghost { border: 1px solid var(--line); padding: 11px; width: 100%; color: var(--ice-dim); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); padding: 7px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--blood); color: var(--blood); }
label.f { display: grid; gap: 6px; font-size: 13px; color: var(--ice-dim); }
input[type=text], input[type=number] {
  background: var(--panel); border: 1px solid var(--line); color: var(--ice); padding: 11px 12px; font-family: var(--mono); font-size: 16px; width: 100%; direction: ltr; letter-spacing: .1em;
}
.big-title { font-family: var(--display); font-weight: 900; color: var(--ice); font-size: clamp(44px, 15vw, 66px); line-height: .95; direction: ltr; text-align: left; letter-spacing: .02em; text-shadow: 0 0 18px rgba(169,220,255,.3); }
.rule { font-family: var(--mono); font-size: 11px; color: var(--ice-dim); direction: ltr; text-align: left; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px 0; }
.terms { display: grid; gap: 8px; font-size: 14px; }
.terms div { display: grid; grid-template-columns: 22px 1fr; gap: 6px; }
.terms div span:first-child { color: var(--blood); font-family: var(--mono); }

.glitch { animation: glitch .35s steps(3) 1; }
@keyframes glitch { 0% { transform: translate(2px,0); filter: hue-rotate(90deg); } 50% { transform: translate(-2px,1px); } 100% { transform: none; filter: none; } }
@media (prefers-reduced-motion: reduce) {
  .blink, .engage::after, .glitch { animation: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<nav aria-label="الأقسام"><div class="in">
  <button data-tab="core"><span class="lt">CORE</span>المواجهة</button>
  <button data-tab="beasts"><span class="lt">ENTITIES</span>الكيانات</button>
  <button data-tab="file"><span class="lt">FILE</span>الملف</button>
</div></nav>
<div id="ov" class="ov" hidden></div>

<script>
(() => {
'use strict';
document.documentElement.dir = 'rtl'; document.documentElement.lang = 'ar';
const DAY = 864e5, HOUR = 36e5, KEY = 'subject-zero.v1';

/* Each entity guards a milestone. Surviving until its day is how you kill it. */
const ENTITIES = [
  { id: 'E-01', d: 1,   en: 'THE WHISPERER', ar: 'الهامس',        n: 11, seed: 41,  lore: 'أول صوت. يقول لك «مرة أخيرة فقط». يعيش في أول 24 ساعة، ويموت إذا لم تُجبه.' },
  { id: 'E-02', d: 3,   en: 'SIREN',         ar: 'النداهة',       n: 11, seed: 7,   lore: 'تتغذى على الملل. تظهر حين يكون الهاتف في يدك ولا شيء تفعله. سلاحها التمرير الذي لا ينتهي.' },
  { id: 'E-03', d: 7,   en: 'HOLLOW',        ar: 'الجوف',         n: 13, seed: 913, lore: 'أسبوع كامل. هنا يبدأ الفراغ الحقيقي ودماغك يطالب بجرعته. الجوف لا يهاجم، ينتظر أن تتعب.' },
  { id: 'E-04', d: 14,  en: 'DOPA-WYRM',     ar: 'دودة الدوبامين', n: 13, seed: 222, lore: 'تحفر في آخر الليل. كل ما تحتاجه شاشة مضاءة وباب مغلق. اقطع طريقها: الهاتف خارج الغرفة.' },
  { id: 'E-05', d: 30,  en: 'THE GLASS',     ar: 'المرآة',        n: 15, seed: 58,  lore: 'شهر. تعرض عليك نسختك القديمة وتقنعك أنها أنت الحقيقي. ليست كذلك.' },
  { id: 'E-06', d: 60,  en: 'ECHO-LEGION',   ar: 'الفيلق',        n: 15, seed: 3071, lore: 'ستون يوماً. لم يعد وحشاً واحداً، صار أصداء ذكريات. كل صدى أضعف من الذي قبله.' },
  { id: 'E-07', d: 90,  en: 'REBOOT',        ar: 'المُعيد',        n: 17, seed: 90,  lore: 'تسعون يوماً. يحاول إعادة تشغيل النظام القديم. هزيمته تعني أن الدوائر أُعيد توصيلها.' },
  { id: 'E-08', d: 180, en: 'SOVEREIGN',     ar: 'الملك القديم',  n: 19, seed: 1180, lore: 'نصف سنة. حكم طويلاً. الآن هو عرش فارغ ينتظر أن تنسى من أنت.' },
  { id: 'E-09', d: 365, en: 'THE ORIGIN',    ar: 'الأصل',         n: 21, seed: 365, lore: 'سنة. المصدر نفسه. لا أحد يعرف شكله الحقيقي قبل أن يصل إليه.' },
];
const RANKS = [[0, 'INITIATE', 'مُستجَد'], [300, 'OPERATIVE', 'عميل'], [1000, 'WARDEN', 'حارس'], [2500, 'HUNTER', 'صيّاد'], [6000, 'PHANTOM', 'شبح'], [12000, 'SOVEREIGN', 'سيّد نفسه']];
const TRIGGERS = ['ملل', 'وحدة', 'ليل', 'توتر', 'تمرير', 'أخرى'];
const MOODS = [['STABLE', 'مستقر'], ['UNSTABLE', 'مضطرب'], ['CRITICAL', 'حرج']];
const ORDERS = [
  'قف الآن. اخرج من الغرفة التي أنت فيها.',
  'ضع الهاتف في غرفة أخرى، الشاشة للأسفل.',
  'ماء بارد على الوجه. الآن.',
  '20 ضغطاً. الجسد يسحب الطاقة من الكيان.',
  'أشعل الضوء. الكيانات تكره الإضاءة.',
  'اكتب في رأسك سبب بدئك هذا البروتوكول.',
  'الرغبة موجة. تبلغ ذروتها ثم تنكسر خلال دقائق.',
];
const BREATH = [['شهيق', 'INHALE', 4], ['احبس', 'HOLD', 4], ['زفير', 'EXHALE', 4], ['احبس', 'HOLD', 4]];
const CYCLES = 4;

/* ---------- state ---------- */
let S = load();
function blank() { return { codename: '', incept: 0, start: 0, best: 0, xp: 0, won: 0, kills: {}, breaches: [], signals: {}, lastMood: null, log: [] }; }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.start) return Object.assign(blank(), s); } catch (e) {} return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function log(type, text, xp) { S.log.unshift({ t: Date.now(), type, text, xp: xp || 0 }); S.log = S.log.slice(0, 200); }

const now = () => Date.now();
const streak = () => Math.max(0, now() - S.start);
const xpTotal = () => S.xp + Math.floor(streak() / HOUR);
const rank = () => { const x = xpTotal(); let r = RANKS[0]; for (const k of RANKS) if (x >= k[0]) r = k; return r; };
const nextEntity = () => ENTITIES.find(e => streak() < e.d * DAY) || null;
const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const pad = n => String(n).padStart(2, '0');
const fmtDate = t => { const d = new Date(t); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };
const fmtStamp = t => { const d = new Date(t); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ---------- dot-matrix creatures ---------- */
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeSprite(seed, n) {
  const r = rng(seed), g = [], h = Math.ceil(n / 2);
  for (let y = 0; y < n; y++) {
    const row = new Array(n).fill(0);
    for (let x = 0; x < h; x++) {
      const dx = (h - 1 - x) / h, dy = Math.abs(y - n * 0.45) / n;
      const v = r() < 0.78 - dx * 0.55 - dy * 0.9 + (y > n * 0.7 ? 0.12 * r() : 0) ? 1 : 0;
      row[x] = v; row[n - 1 - x] = v;
    }
    g.push(row);
  }
  const ey = Math.floor(n * 0.36), ex = h - 2 - Math.floor(n / 6);
  for (let y = ey - 1; y <= ey + 1; y++) for (let x = ex - 1; x <= ex + 1; x++) { g[y][x] = 1; g[y][n - 1 - x] = 1; }
  g[ey][ex] = 2; g[ey][n - 1 - ex] = 2;
  const my = Math.floor(n * 0.62);
  for (let x = Math.floor(n * 0.3); x < Math.ceil(n * 0.7); x++) g[my][x] = x % 2 ? 1 : 0;
  // limbs
  for (let y = my + 1; y < n; y++) { const x = Math.floor(n * 0.2 + r() * 2); if (r() < 0.7) { g[y][x] = 1; g[y][n - 1 - x] = 1; } }
  return { n, g };
}

const LIVE = new Map(); // canvas -> {sprite, mode, color, dissolve, born}
function bindCanvas(c, sprite, mode, color) {
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = c.clientWidth || 120;
  c.width = c.height = Math.round(w * dpr);
  LIVE.set(c, { sprite, mode, color: color || '#a9dcff', born: now(), seedNoise: Math.random() * 1e9 });
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function drawSprite(c, st, t) {
  const ctx = c.getContext('2d'), { n, g } = st.sprite, W = c.width, cs = W / (n + 2);
  ctx.clearRect(0, 0, W, W);
  const glitch = !reduced && st.mode === 'alive' && (t % 2600) < 110;
  const noise = rng(Math.floor(t / 110) + st.seedNoise);
  const dissolve = st.mode === 'dying' ? Math.min(1, (t - st.born) / 1400) : 0;
  const pulse = 0.55 + 0.45 * Math.sin(t / 260);
  for (let y = 0; y < n; y++) {
    const shift = glitch && noise() < 0.3 ? (noise() < 0.5 ? -1 : 1) : 0;
    for (let x = 0; x < n; x++) {
      let v = g[y][x];
      if (st.mode === 'locked') v = noise() < 0.28 ? 1 : 0;
      if (dissolve && v && noise() < dissolve) v = 0;
      const px = (x + 1.5 + shift) * cs, py = (y + 1.5 + (st.mode === 'dying' && v === 0 && g[y][x] ? dissolve * 3 : 0)) * cs;
      ctx.beginPath();
      if (v === 2 && st.mode !== 'locked') {
        ctx.fillStyle = st.mode === 'dead' ? '#4f7389' : st.color === '#ff4b3a' ? 'rgba(223,233,238,' + pulse + ')' : 'rgba(255,75,58,' + pulse + ')';
        ctx.arc(px, py, cs * 0.42, 0, 7);
      } else if (v) {
        ctx.fillStyle = st.mode === 'dead' ? '#2c4252' : st.mode === 'locked' ? '#1a2a36' : st.color;
        ctx.arc(px, py, cs * 0.36, 0, 7);
      } else {
        ctx.fillStyle = '#121d25';
        ctx.arc(px, py, cs * 0.12, 0, 7);
      }
      ctx.fill();
    }
  }
  if (st.mode === 'dead') { ctx.strokeStyle = '#ff4b3a'; ctx.lineWidth = Math.max(1, W / 90); ctx.beginPath(); ctx.moveTo(W * .15, W * .85); ctx.lineTo(W * .85, W * .15); ctx.stroke(); }
}
let lastFrame = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (t - lastFrame < 50) return; lastFrame = t;
  const tt = now();
  for (const [c, st] of LIVE) {
    if (!c.isConnected) { LIVE.delete(c); continue; }
    if (c.offsetParent === null && !c.closest('.ov')) continue;
    drawSprite(c, st, tt);
  }
}
requestAnimationFrame(frame);

/* ---------- views ---------- */
const app = document.getElementById('app'), ov = document.getElementById('ov');
let tab = 'core';
try { tab = sessionStorage.getItem(KEY + '.tab') || 'core'; } catch (e) {}

function topbar() {
  return `<div class="bar"><span class="lt">SUBJECT <b>${esc(S.codename)}</b> · ${rank()[1]}</span><span class="lt"><span class="blink">●</span> REC</span></div>`;
}

function viewCore() {
  const e = nextEntity(), ms = streak();
  const today = S.signals[dayKey(now())];
  return `${topbar()}
  <section class="frame">
    <div class="frame-h"><span class="lt">CONTAINMENT TIME</span><span>مدة الصمود</span></div>
    <div class="streak">
      <div class="days" id="days">${Math.floor(ms / DAY)}<small>DAYS</small></div>
      <div class="clock" id="clock">00:00:00</div>
      <div class="sub">منذ <span class="lt">${fmtDate(S.start)}</span> · أفضل رقم <span class="lt" id="best"></span></div>
    </div>
  </section>
  ${e ? `<section class="frame entity">
    <canvas id="cur" aria-label="الكيان ${esc(e.ar)}"></canvas>
    <div class="info">
      <div class="ename">${e.id} // ${e.en}</div>
      <div class="ename-ar">${esc(e.ar)}</div>
      <div class="hp"><div style="display:flex;justify-content:space-between"><span>طاقة الكيان</span><span class="lt" id="hpv"></span></div><div class="hpbar"><i id="hpbar"></i></div></div>
      <div class="sub">يسقط عند اليوم <span class="lt">${e.d}</span> · المتبقي <span class="lt" id="left"></span></div>
    </div>
  </section>` : `<section class="frame"><div class="empty">كل الكيانات سقطت. أنت الآن خارج نطاق البروتوكول.</div></section>`}
  <button class="engage" id="engage"><span class="big">⚠ ENGAGE</span><span class="ar">رغبة الآن؟ ادخل المواجهة</span></button>
  <div class="pair">
    <button class="btn" id="signal" ${today ? 'disabled' : ''}><span class="lt">${today ? 'SIGNAL SENT' : 'DAILY SIGNAL'}</span>${today ? 'تم الإرسال اليوم' : 'إشارة اليوم'}</button>
    <button class="btn dim" id="breach"><span class="lt">BREACH</span>تسجيل انتكاسة</button>
  </div>
  <section class="frame rows">
    <div class="row"><span class="k">الرتبة</span><span class="v">${rank()[1]} · ${rank()[2]}</span></div>
    <div class="row"><span class="k">نقاط الخبرة</span><span class="v" id="xp">${xpTotal()} XP</span></div>
    <div class="row"><span class="k">مواجهات انتصرت فيها</span><span class="v">${S.won}</span></div>
    <div class="row"><span class="k">كيانات أُسقطت</span><span class="v">${Object.keys(S.kills).length} / ${ENTITIES.length}</span></div>
  </section>`;
}

function viewBeasts() {
  const ms = streak(), cur = nextEntity();
  return `${topbar()}
  <div class="rule">BESTIARY // ${Object.keys(S.kills).length} TERMINATED · ${ENTITIES.length} KNOWN</div>
  <div class="list">${ENTITIES.map(e => {
    const dead = S.kills[e.id], live = cur && cur.id === e.id, locked = !dead && !live;
    return `<article class="frame beast ${locked ? 'locked' : ''}">
      <canvas data-ent="${e.id}" data-mode="${dead ? 'dead' : live ? 'alive' : 'locked'}"></canvas>
      <div class="info">
        <span class="tag ${dead ? 'dead' : live ? 'live' : 'lock'}">${dead ? 'TERMINATED' : live ? 'ACTIVE' : 'CLASSIFIED'}</span>
        <div class="ename">${e.id} // ${locked ? '█████' : e.en}</div>
        <div class="ename-ar">${locked ? 'مجهول' : esc(e.ar)}</div>
        <p>${locked ? `يظهر بعد سقوط الكيان السابق. حارس اليوم <span class="lt">${e.d}</span>.` : esc(e.lore)}</p>
        ${dead ? `<div class="sub">أُسقط في <span class="lt">${fmtDate(dead)}</span></div>` : live ? `<div class="sub">${Math.floor(ms / DAY)} / ${e.d} يوم</div>` : ''}
      </div>
    </article>`;
  }).join('')}</div>`;
}

function viewFile() {
  const recent = S.breaches.filter(b => now() - b.t < 30 * DAY).length;
  const threat = '★'.repeat(Math.min(3, recent)) + '☆'.repeat(3 - Math.min(3, recent));
  const days = [];
  const today0 = new Date(); today0.setHours(0, 0, 0, 0);
  for (let i = 27; i >= 0; i--) {
    const d0 = today0.getTime() - i * DAY, d1 = d0 + DAY;
    const br = S.breaches.some(b => b.t >= d0 && b.t < d1);
    days.push(br ? 'b' : d1 > S.incept && d0 <= now() ? 'c' : '');
  }
  const counts = TRIGGERS.map(t => [t, S.breaches.filter(b => b.trig === t).length]);
  const max = Math.max(1, ...counts.map(c => c[1]));
  return `${topbar()}
  <section class="frame file">
    <div class="frame-h"><span class="lt">SUBJECT FILE</span><span class="lt">${esc(S.codename)}</span></div>
    <div class="rows">
      <div class="row"><span class="k">الاسم الرمزي</span><span class="v">${esc(S.codename)}</span></div>
      <div class="row"><span class="k">تاريخ البدء</span><span class="v">${fmtDate(S.incept)}</span></div>
      <div class="row"><span class="k">الوظيفة</span><span class="v">HUNTER</span></div>
      <div class="row"><span class="k">الحالة الذهنية</span><span class="v">${S.lastMood != null ? MOODS[S.lastMood][0] : 'UNKNOWN'}</span></div>
      <div class="row"><span class="k">مستوى التهديد (30 يوم)</span><span class="v">${threat}</span></div>
      <div class="row"><span class="k">أفضل صمود</span><span class="v">${fmtDur(Math.max(S.best, streak()))}</span></div>
      <div class="row"><span class="k">الاختراقات</span><span class="v">${S.breaches.length}</span></div>
    </div>
  </section>
  <section class="frame">
    <div class="frame-h"><span class="lt">28-DAY TRACE</span><span>آخر 28 يوماً</span></div>
    <div class="grid28">${days.map(c => `<i class="${c}"></i>`).join('')}</div>
    <div class="legend"><span style="--c:var(--ice)">صمود</span><span style="--c:var(--blood)">اختراق</span><span style="--c:var(--line)">قبل البدء</span></div>
  </section>
  <section class="frame">
    <div class="frame-h"><span class="lt">BREACH VECTORS</span><span>مصادر الاختراق</span></div>
    ${S.breaches.length ? `<div class="trig">${counts.map(([t, n]) => `<div class="t"><span>${t}</span><span class="dots">${'●'.repeat(Math.round(n / max * 14)) || '·'}</span><span class="n">${n}</span></div>`).join('')}</div>` : '<div class="empty">لا اختراقات مسجلة. حين يحدث واحد، ستظهر هنا أنماطه لتعرف أين يهاجمك الكيان.</div>'}
  </section>
  <section class="frame">
    <div class="frame-h"><span class="lt">EVENT LOG</span><span>السجل</span></div>
    <div class="log">${S.log.slice(0, 14).map(l => `<div class="${l.type === 'breach' ? 'r' : l.type === 'kill' || l.type === 'win' ? 'w' : ''}">${fmtStamp(l.t)}  ${esc(l.text)}${l.xp ? '  +' + l.xp : ''}</div>`).join('')}</div>
  </section>
  <button class="ghost" id="wipe">مسح كل البيانات</button>`;
}

function fmtDur(ms) { const d = Math.floor(ms / DAY), h = Math.floor(ms % DAY / HOUR); return d + 'D ' + pad(h) + 'H'; }

function render() {
  if (!S) return renderInit();
  document.querySelector('nav').hidden = false;
  app.innerHTML = tab === 'beasts' ? viewBeasts() : tab === 'file' ? viewFile() : viewCore();
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  const e = nextEntity(), cur = document.getElementById('cur');
  if (cur && e) bindCanvas(cur, makeSprite(e.seed, e.n), 'alive');
  app.querySelectorAll('canvas[data-ent]').forEach(c => { const en = ENTITIES.find(x => x.id === c.dataset.ent); bindCanvas(c, makeSprite(en.seed, en.n), c.dataset.mode); });
  wire();
  tick();
}

function wire() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('engage', startEncounter);
  on('signal', openSignal);
  on('breach', openBreach);
  on('wipe', openWipe);
}

function tick() {
  if (!S) return;
  const ms = streak();
  checkKills();
  const d = document.getElementById('days');
  if (d) d.firstChild.nodeValue = Math.floor(ms / DAY);
  const c = document.getElementById('clock');
  if (c) c.textContent = pad(Math.floor(ms % DAY / HOUR)) + ':' + pad(Math.floor(ms % HOUR / 6e4)) + ':' + pad(Math.floor(ms % 6e4 / 1e3));
  const b = document.getElementById('best'); if (b) b.textContent = fmtDur(Math.max(S.best, ms));
  const xp = document.getElementById('xp'); if (xp) xp.textContent = xpTotal() + ' XP';
  const e = nextEntity();
  if (e) {
    const prev = ENTITIES[ENTITIES.indexOf(e) - 1], from = prev ? prev.d * DAY : 0;
    const hp = Math.max(0, 1 - (ms - from) / (e.d * DAY - from));
    const bar = document.getElementById('hpbar'); if (bar) bar.style.width = (hp * 100).toFixed(1) + '%';
    const v = document.getElementById('hpv'); if (v) v.textContent = (hp * 100).toFixed(1) + '%';
    const l = document.getElementById('left'); if (l) l.textContent = fmtDur(e.d * DAY - ms);
  }
}
setInterval(tick, 1000);

function checkKills() {
  if (!ov.hidden) return;
  for (const e of ENTITIES) {
    if (streak() >= e.d * DAY && !S.kills[e.id]) {
      S.kills[e.id] = now(); S.xp += 200; log('kill', e.id + ' ' + e.en + ' TERMINATED', 200); save();
      showKill(e); return;
    }
  }
}

/* ---------- overlays ---------- */
function openOv(html, red) { ov.className = 'ov' + (red ? ' red' : ''); ov.innerHTML = '<div class="in">' + html + '</div>'; ov.hidden = false; ov.scrollTop = 0; }
function closeOv() { ov.hidden = true; ov.innerHTML = ''; render(); }

function showKill(e) {
  buzz([60, 40, 60, 40, 200]);
  openOv(`<h2>ENTITY TERMINATED</h2>
    <canvas class="foe" id="kc"></canvas>
    <h3>${esc(e.ar)} سقط.</h3>
    <p>صمدت <span class="lt">${e.d}</span> ${e.d === 1 ? 'يوماً' : 'أيام'} دون أن تُطعمه. <span class="lt">+200 XP</span>. الكيان التالي استيقظ ويعرف اسمك الآن.</p>
    <button class="cta" id="ok">استمر</button>`);
  const c = document.getElementById('kc'); bindCanvas(c, makeSprite(e.seed, e.n), 'dying', '#a9dcff');
  document.getElementById('ok').onclick = closeOv;
}

let enc = null;
function startEncounter() {
  buzz(120);
  const seed = Math.floor(Math.random() * 1e6), id = 'SPAWN-' + seed.toString(16).toUpperCase().slice(0, 4);
  enc = { id, seed, step: 0, left: BREATH[0][2], order: Math.floor(Math.random() * ORDERS.length), timer: null };
  openOv(`<h2>ENCOUNTER // ${id}</h2>
    <canvas class="foe" id="foe" aria-label="الكيان المهاجم"></canvas>
    <div class="hp"><div style="display:flex;justify-content:space-between"><span>طاقة الكيان</span><span class="lt" id="ehp">100%</span></div><div class="hpbar"><i id="ebar" style="width:100%"></i></div></div>
    <div class="phase" aria-live="polite"><span class="lt" id="pen" style="color:var(--ice-dim);font-size:12px">${BREATH[0][1]}</span><span class="w" id="par">${BREATH[0][0]}</span><span class="n" id="pn">${BREATH[0][2]}</span></div>
    <div class="order"><b>DIRECTIVE</b><span id="ord">${ORDERS[enc.order]}</span></div>
    <p class="sub">كل نفَس كامل يُضعف الكيان. أربع دورات وينهار. لا تنظر إلى أي شاشة أخرى.</p>
    <button class="ghost" id="flee">انسحاب</button>`, true);
  bindCanvas(document.getElementById('foe'), makeSprite(seed, 15), 'alive', '#ff4b3a');
  document.getElementById('flee').onclick = () => { clearInterval(enc.timer); enc = null; closeOv(); };
  enc.timer = setInterval(encTick, 1000);
}
function encTick() {
  if (!enc) return;
  enc.left--;
  if (enc.left <= 0) {
    enc.step++;
    buzz(30);
    const total = BREATH.length * CYCLES;
    const hp = Math.max(0, 1 - enc.step / total);
    document.getElementById('ebar').style.width = (hp * 100) + '%';
    document.getElementById('ehp').textContent = Math.round(hp * 100) + '%';
    const foe = document.getElementById('foe'); foe.classList.remove('glitch'); void foe.offsetWidth; foe.classList.add('glitch');
    if (enc.step >= total) return winEncounter();
    if (enc.step % BREATH.length === 0) { enc.order = (enc.order + 1) % ORDERS.length; document.getElementById('ord').textContent = ORDERS[enc.order]; }
    enc.left = BREATH[enc.step % BREATH.length][2];
  }
  const p = BREATH[enc.step % BREATH.length];
  document.getElementById('par').textContent = p[0];
  document.getElementById('pen').textContent = p[1] + ' · ' + (Math.floor(enc.step / BREATH.length) + 1) + '/' + CYCLES;
  document.getElementById('pn').textContent = enc.left;
}
function winEncounter() {
  clearInterval(enc.timer);
  S.won++; S.xp += 50; log('win', 'ENCOUNTER ' + enc.id + ' WON', 50); save();
  buzz([80, 50, 160]);
  const seed = enc.seed; enc = null;
  openOv(`<h2>THREAT NEUTRALIZED</h2>
    <canvas class="foe" id="kc"></canvas>
    <h3>الموجة انكسرت.</h3>
    <p>هذه المواجهة رقم <span class="lt">${S.won}</span> تنتصر فيها. <span class="lt">+50 XP</span>. الرغبة تعود أضعف كل مرة لا تُطعمها.</p>
    <button class="cta" id="ok">عودة إلى النواة</button>`, true);
  bindCanvas(document.getElementById('kc'), makeSprite(seed, 15), 'dying', '#ff4b3a');
  document.getElementById('ok').onclick = closeOv;
}

function openSignal() {
  openOv(`<h2>DAILY SIGNAL</h2>
    <h3>ما حالتك الآن؟</h3>
    <p>إشارة واحدة كل يوم. تبقي ملفك حياً وتمنحك <span class="lt">+10 XP</span>.</p>
    <div class="chips">${MOODS.map((m, i) => `<button class="chip" data-m="${i}"><span class="lt">${m[0]}</span> · ${m[1]}</button>`).join('')}</div>
    <button class="ghost" id="x">إلغاء</button>`);
  ov.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const m = +b.dataset.m;
    S.signals[dayKey(now())] = m; S.lastMood = m; S.xp += 10; log('signal', 'SIGNAL ' + MOODS[m][0], 10); save();
    if (m === 2) {
      openOv(`<h2>CRITICAL STATE</h2><h3>الكيان قريب.</h3><p>لا تنتظره حتى يهاجم. ادخل المواجهة الآن وأنهِ الموجة وهي صغيرة.</p>
        <button class="cta red" id="go">ادخل المواجهة</button><button class="ghost" id="x">لاحقاً</button>`, true);
      document.getElementById('go').onclick = startEncounter;
      document.getElementById('x').onclick = closeOv;
    } else closeOv();
  });
  document.getElementById('x').onclick = closeOv;
}

function openBreach() {
  let trig = null;
  openOv(`<h2>BREACH REPORT</h2>
    <h3>سجّل الاختراق بصدق.</h3>
    <p>العدّاد سيعود إلى الصفر. نقاطك، الكيانات التي أسقطتها، وأفضل رقم لك تبقى في الملف. ما الذي فتح الباب؟</p>
    <div class="chips">${TRIGGERS.map(t => `<button class="chip" data-t="${t}" aria-pressed="false">${t}</button>`).join('')}</div>
    <button class="cta red" id="go" disabled>تأكيد الاختراق</button>
    <button class="ghost" id="x">تراجع، لم يحدث</button>`, true);
  const go = document.getElementById('go');
  ov.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    trig = b.dataset.t; ov.querySelectorAll('[data-t]').forEach(c => c.setAttribute('aria-pressed', c === b)); go.disabled = false;
  });
  go.onclick = () => {
    const ms = streak();
    S.best = Math.max(S.best, ms); S.breaches.push({ t: now(), trig }); S.start = now();
    log('breach', 'BREACH [' + trig + '] AFTER ' + fmtDur(ms)); save();
    buzz(300);
    openOv(`<h2>SYSTEM REBOOT</h2>
      <h3>جولة خسرتها. الحرب لم تنتهِ.</h3>
      <p>أفضل رقم لك ما زال <span class="lt">${fmtDur(S.best)}</span>. أنت تعرف الآن أن «${esc(trig)}» هو مدخله. في المرة القادمة حين تشعر به، اضغط المواجهة قبل أن تفكر.</p>
      <button class="cta" id="ok">ابدأ العدّ من جديد</button>`, true);
    document.getElementById('ok').onclick = closeOv;
  };
  document.getElementById('x').onclick = closeOv;
}

function openWipe() {
  openOv(`<h2>PURGE FILE</h2><h3>مسح الملف بالكامل؟</h3><p>سيُحذف كل شيء من هذا الجهاز: العدّاد، النقاط، الكيانات، السجل. لا يمكن التراجع.</p>
    <button class="cta red" id="go">امسح كل شيء</button><button class="ghost" id="x">إلغاء</button>`, true);
  document.getElementById('go').onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} S = null; ov.hidden = true; render(); };
  document.getElementById('x').onclick = closeOv;
}

function renderInit() {
  document.querySelector('nav').hidden = true;
  const code = 'Z-' + Math.floor(10 + Math.random() * 89);
  app.innerHTML = `
    <div class="bar"><span class="lt">PROTOCOL // ZERO</span><span class="lt"><span class="blink">●</span> AWAITING SUBJECT</span></div>
    <div class="big-title">SUBJECT<br>ZERO</div>
    <div class="rule">CONTAINMENT PROGRAM · 9 ENTITIES · 365 DAYS</div>
    <canvas class="foe" id="intro" aria-hidden="true"></canvas>
    <p style="margin:0">هناك كيانات تتغذى على انتباهك. كل يوم تصمد فيه يستنزف طاقتها. صمد حتى يوم الكيان، فيسقط. حين تهاجمك الرغبة، تدخل مواجهة وتُنهيها بأنفاسك.</p>
    <div class="terms">
      <div><span>01</span><span>العدّاد لا يتوقف إلا باختراق تسجله أنت.</span></div>
      <div><span>02</span><span>الكيانات التي تُسقطها تبقى في ملفك للأبد.</span></div>
      <div><span>03</span><span>بياناتك على هذا الجهاز فقط. لا حساب، لا خادم.</span></div>
    </div>
    <label class="f" for="cn">الاسم الرمزي<input type="text" id="cn" maxlength="14" value="${code}" autocomplete="off"></label>
    <label class="f" for="ago">منذ كم يوماً كانت آخر مرة؟ (0 = اليوم)<input type="number" id="ago" min="0" max="999" value="0" inputmode="numeric"></label>
    <button class="cta" id="begin">ابدأ البروتوكول</button>`;
  bindCanvas(document.getElementById('intro'), makeSprite(365, 21), 'alive', '#a9dcff');
  document.getElementById('begin').onclick = () => {
    const cn = (document.getElementById('cn').value.trim() || code).toUpperCase().replace(/[^A-Z0-9\-_.]/g, '').slice(0, 14) || code;
    const ago = Math.max(0, Math.min(999, parseInt(document.getElementById('ago').value, 10) || 0));
    S = blank(); S.codename = cn; S.start = now() - ago * DAY; S.incept = S.start;
    log('init', 'PROTOCOL INITIATED · ' + cn);
    // entities already passed before install count as kills
    for (const e of ENTITIES) if (ago >= e.d) { S.kills[e.id] = now(); S.xp += 200; }
    save(); tab = 'core'; render();
  };
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; try { sessionStorage.setItem(KEY + '.tab', tab); } catch (e) {}
  render(); window.scrollTo(0, 0);
});

render();
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
})();
</script>
</body>
</html>
